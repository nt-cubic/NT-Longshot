<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Fixture B · Sticky 头部 + 懒加载图片（模拟微博）</title>
<style>
  body { margin: 0; font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; }
  header { position: sticky; top: 0; height: 56px; background: #1f2430; color: #fff;
    display: flex; align-items: center; padding: 0 20px; z-index: 10; }
  .wrap { display: flex; gap: 20px; padding: 16px 20px 400px; }
  main { flex: 0 0 640px; }
  aside { flex: 1; position: sticky; top: 72px; align-self: flex-start;
    background: #eef1f6; border-radius: 10px; padding: 16px; }
  section { margin-bottom: 48px; }
  .ph { height: 260px; background: #d8dde5; display: flex; align-items: center;
    justify-content: center; color: #67707e; border-radius: 10px; }
  .ph img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; display: block; }
  #fab { position: fixed; right: 24px; bottom: 24px; width: 48px; height: 48px; border-radius: 50%;
    background: #3478f6; color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 24px; box-shadow: 0 4px 14px rgba(0,0,0,.3); z-index: 10; }
  #bottombar { position: fixed; left: 0; right: 0; bottom: 0; height: 44px; background: #2a2f3a; color: #fff;
    display: flex; align-items: center; padding: 0 16px; z-index: 10; }
  #shadow-host { position: fixed; left: 50%; bottom: 52px; transform: translateX(-50%); z-index: 10; }
</style>
</head>
<body>
<header><b>Sticky 头部</b><span style="margin-left:auto">Fixture B</span></header>
<div class="wrap">
  <main id="main"></main>
  <aside><b>Sticky 侧栏</b><p>滚动时保持可见的悬浮内容，长图里只应出现一次（首帧位置）。</p></aside>
</div>
<div id="fab">↑</div>
<div id="bottombar">固定底栏（长图里只应出现一次）</div>
<div id="shadow-host"></div>
<script>
  // Shadow DOM 浮动条：验证悬浮元素收集能穿透 shadow root
  const host = document.getElementById('shadow-host');
  const root = host.attachShadow({ mode: 'open' });
  root.innerHTML = `<div style="position:fixed;left:50%;bottom:52px;transform:translateX(-50%);
    background:#7a3ff2;color:#fff;font:13px system-ui;padding:6px 16px;border-radius:8px;">
    Shadow DOM 浮动条（只应出现一次）</div>`;
  // 页面中途挂载一个浮动条（3 秒后）——验证每帧重收集
  setTimeout(() => {
    const late = document.createElement('div');
    late.id = 'latebar';
    late.textContent = '中途挂载的悬浮条（只应出现一次）';
    late.style.cssText = 'position:fixed;top:60px;right:12px;background:#c2410c;color:#fff;font:13px system-ui;padding:6px 12px;border-radius:8px;z-index:10;';
    document.body.appendChild(late);
  }, 3000);
  // 懒加载：占位块进入视口 400ms 后才注入图片（IntersectionObserver，模拟微博）
  const main = document.getElementById('main');
  const N = 24;
  for (let i = 0; i < N; i++) {
    const s = document.createElement('section');
    s.innerHTML = `<h2>第 ${i} 节</h2>
      <div class="ph" data-i="${i}">懒加载占位 ${i}</div>
      <p>第 ${i} 节正文：验证懒加载在滚动截图时被正确等待，不出现灰色占位块。</p>`;
    main.appendChild(s);
  }
  const io = new IntersectionObserver((es) => {
    for (const e of es) {
      if (!e.isIntersecting) continue;
      const d = e.target;
      io.unobserve(d);
      setTimeout(() => {
        const i = d.dataset.i;
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260">
          <rect width="100%" height="100%" fill="hsl(${i * 47},70%,80%)"/>
          <text x="50%" y="50%" font-size="48" text-anchor="middle" dominant-baseline="middle" fill="#123">图片 ${i}</text></svg>`;
        d.innerHTML = `<img src="data:image/svg+xml,${encodeURIComponent(svg)}">`;
      }, 400);
    }
  }, { rootMargin: '200px' });
  document.querySelectorAll('.ph').forEach((d) => io.observe(d));
</script>
</body>
</html>
