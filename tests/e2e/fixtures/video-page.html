<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Fixture F · 视频页（模拟 YouTube/Bilibili 播放器）</title>
<style>
  body { margin: 0; font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; background: #0f0f0f; color: #eee; }
  header { position: sticky; top: 0; height: 56px; background: #1f2430; display: flex; align-items: center;
    padding: 0 20px; z-index: 10; }
  .wrap { display: flex; gap: 20px; padding: 16px 20px 300px; }
  main { flex: 0 0 820px; }
  aside { flex: 1; }
  .player { width: 820px; height: 300px; background: #000; position: relative; }
  .player canvas { width: 100%; height: 100%; display: block; }
  .player .title { position: absolute; left: 12px; top: 10px; color: #fff; font: 14px system-ui;
    background: rgba(0,0,0,.6); padding: 4px 10px; border-radius: 4px; }
  .comment { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #272727; }
  .comment .avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; }
</style>
</head>
<body>
<header><b>视频站 Fixture</b><span style="margin-left:auto">Fixture F</span></header>
<div class="wrap">
  <main>
    <div class="player">
      <canvas id="screen" width="800" height="300"></canvas>
      <div class="title">模拟播放器（canvas 噪声 = 每帧变化的像素）</div>
    </div>
    <h2>视频标题：动态像素对拼接的考验</h2>
    <p>播放器区域每帧都在变（rAF 随机噪声）。拼接比对必须跳过视频列，用评论区做证据。</p>
    <div id="comments"></div>
  </main>
  <aside><b>侧栏</b><p>静态推荐列表，可作为比对证据的列。</p>
    <div id="reco"></div>
  </aside>
</div>
<script>
  // 播放器噪声：每帧随机（等价于视频播放中的动态像素）
  const cv = document.getElementById('screen');
  const cx = cv.getContext('2d');
  (function draw() {
    const img = cx.createImageData(cv.width, cv.height);
    for (let i = 0; i < img.data.length; i += 4) {
      img.data[i] = Math.random() * 255;
      img.data[i + 1] = Math.random() * 255;
      img.data[i + 2] = Math.random() * 255;
      img.data[i + 3] = 255;
    }
    cx.putImageData(img, 0, 0);
    requestAnimationFrame(draw);
  })();

  // 评论区（带独立底色的行，便于校验）
  const comments = document.getElementById('comments');
  const N = 24;
  for (let i = 0; i < N; i++) {
    const d = document.createElement('div');
    d.className = 'comment';
    d.style.background = `hsl(${(i * 37) % 360} 30% ${16 + (i % 2) * 3}%)`;
    d.innerHTML = `<div class="avatar" style="background:hsl(${i * 47},60%,45%)"></div>
      <div><b>用户 ${i}</b><br>评论 ${i}：视频页长截图测试，第 ${i} 楼。</div>`;
    comments.appendChild(d);
  }
  const reco = document.getElementById('reco');
  for (let i = 0; i < 10; i++) {
    const d = document.createElement('div');
    d.style.cssText = 'height:80px;margin:8px 0;background:#1c1e22;border-radius:8px;padding:8px;';
    d.textContent = `推荐 ${i}`;
    reco.appendChild(d);
  }
</script>
</body>
</html>
